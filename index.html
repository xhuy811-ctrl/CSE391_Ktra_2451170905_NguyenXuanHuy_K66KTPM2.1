<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="./css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <div class="container container-custom py-5">
      <div class="main-wrapper">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h2 class="fw-bold text-dark mb-0">Task List</h2>
          <button class="btn btn-purple px-4 py-2 fw-semibold shadow-sm" id="btnMoForm">
            <i class="bi bi-plus-lg me-1"></i> Add Task
          </button>
        </div>

        <div id="taskList" class="d-flex flex-column gap-3">
          
          <div class="task-item d-flex align-items-center justify-content-between p-3 bg-white shadow-sm rounded-4">
            <div class="d-flex align-items-center gap-5 flex-grow-1">
              <div style="min-width: 120px;">
                <span class="text-muted small d-block">Task</span>
                <span class="fw-semibold text-dark">Go to gym</span>
              </div>
              <div style="min-width: 100px;">
                <span class="text-muted small d-block">Priority</span>
                <span class="fw-bold priority-high">High</span>
              </div>
            </div>
            <div class="d-flex align-items-center gap-4">
              <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill">To Do</span>
              <div class="status-circle circle-todo"></div>
              <div class="action-buttons d-flex gap-2">
                <button class="btn btn-link p-1 text-secondary"><i class="bi bi-pencil-square fs-5"></i></button>
                <button class="btn btn-link p-1 text-danger-custom"><i class="bi bi-trash fs-5"></i></button>
              </div>
            </div>
          </div>

          <div class="task-item d-flex align-items-center justify-content-between p-3 bg-white shadow-sm rounded-4">
            <div class="d-flex align-items-center gap-5 flex-grow-1">
              <div style="min-width: 120px;">
                <span class="text-muted small d-block">Task</span>
                <span class="fw-semibold text-dark">Read a book</span>
              </div>
              <div style="min-width: 100px;">
                <span class="text-muted small d-block">Priority</span>
                <span class="fw-bold priority-low">Low</span>
              </div>
            </div>
            <div class="d-flex align-items-center gap-4">
              <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill">Done</span>
              <div class="status-circle circle-done"></div>
              <div class="action-buttons d-flex gap-2">
                <button class="btn btn-link p-1 text-secondary"><i class="bi bi-pencil-square fs-5"></i></button>
                <button class="btn btn-link p-1 text-danger-custom"><i class="bi bi-trash fs-5"></i></button>
              </div>
            </div>
          </div>

          <div class="task-item d-flex align-items-center justify-content-between p-3 bg-white shadow-sm rounded-4">
            <div class="d-flex align-items-center gap-5 flex-grow-1">
              <div style="min-width: 120px;">
                <span class="text-muted small d-block">Task</span>
                <span class="fw-semibold text-dark">Go to market</span>
              </div>
              <div style="min-width: 100px;">
                <span class="text-muted small d-block">Priority</span>
                <span class="fw-bold priority-medium">Medium</span>
              </div>
            </div>
            <div class="d-flex align-items-center gap-4">
              <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill">In Progress</span>
              <div class="status-circle circle-progress"></div>
              <div class="action-buttons d-flex gap-2">
                <button class="btn btn-link p-1 text-secondary"><i class="bi bi-pencil-square fs-5"></i></button>
                <button class="btn btn-link p-1 text-danger-custom"><i class="bi bi-trash fs-5"></i></button>
              </div>
            </div>
          </div>

        </div>
      </div>

      <div class="card form-card shadow mt-4 rounded-4" id="formCard" style="display: none;">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold text-dark mb-0">Add Task</h5>
            <button type="button" class="btn-close fs-6" id="btnDongForm"></button>
          </div>

          <form id="formTask">
  <div class="mb-3">
    <label class="form-label small text-muted fw-semibold mb-1">Task</label>
    <input
      type="text"
      class="form-control form-control-custom py-2"
      id="inputTask"
      placeholder="Type your task here..."
    />
    <div id="errorTask" class="text-danger small mt-1" style="display: none"></div>
  </div>

  <div class="mb-3">
    <label class="form-label small text-muted fw-semibold mb-2">Status</label>
    <select class="form-select form-control-custom py-2" id="selectStatus">
      <option value="To Do">To Do</option>
      <option value="In Progress">In Progress</option>
      <option value="Done">Done</option>
    </select>
  </div>

  <div class="mb-4">
    <label class="form-label small text-muted fw-semibold mb-2">Priority</label>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-priority-select p-high" id="btnHigh" onclick="chonPriority('High')">High</button>
      <button type="button" class="btn btn-priority-select p-medium" id="btnMedium" onclick="chonPriority('Medium')">Medium</button>
      <button type="button" class="btn btn-priority-select p-low active" id="btnLow" onclick="chonPriority('Low')">Low</button>
    </div>
  </div>

  <div class="text-end">
    <button type="submit" class="btn btn-submit-task px-4 py-2 fw-semibold">
      Add
    </button>
  </div>
</form>
        </div>
      </div>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
